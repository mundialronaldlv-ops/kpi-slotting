<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Ejecutivo de Inventarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="h-screen w-screen p-4 bg-slate-900 text-slate-100 flex flex-col overflow-hidden justify-between">

    <div class="max-w-[1600px] mx-auto w-full h-full flex flex-col justify-between gap-2.5">

        <!-- Control Superior -->
        <header class="flex justify-between items-center bg-slate-800 px-4 py-2 rounded-xl border border-slate-700 shadow-md">
            <div>
                <h1 class="text-base font-bold tracking-tight text-white flex items-center gap-2">
                    📊 Reporte Ejecutivo de Rotación e Inventarios
                    <span id="liveBadge" class="text-[10px] bg-amber-500/20 text-amber-400 font-semibold px-2 py-0.5 rounded-full border border-amber-500/30">Cargando Google Drive...</span>
                </h1>
            </div>

            <div class="flex items-center gap-3">
                <div class="flex items-center gap-1.5 bg-slate-900/60 px-2 py-1 rounded-lg border border-slate-700">
                    <label for="yearSelector" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Año:</label>
                    <select id="yearSelector" class="bg-slate-800 text-white border border-slate-600 rounded px-2 py-0.5 text-xs font-medium focus:outline-none"></select>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-900/60 px-2 py-1 rounded-lg border border-slate-700">
                    <label for="monthSelector" class="text-xs font-semibold uppercase tracking-wider text-slate-400">Mes:</label>
                    <select id="monthSelector" class="bg-slate-800 text-white border border-slate-600 rounded px-2 py-0.5 text-xs font-medium focus:outline-none"></select>
                </div>
                <button onclick="fetchDataDrive()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-medium px-3 py-1 rounded-lg border border-slate-600 transition-colors cursor-pointer">
                    🔄 Sincronizar
                </button>
            </div>
        </header>

        <!-- Estado de Alerta -->
        <div id="statusAlert" class="hidden px-3 py-1 rounded-lg text-xs font-medium border"></div>

        <!-- Tarjetas KPI (En Millones) -->
        <section class="grid grid-cols-4 gap-3">
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                <p id="kpiPurchasesLabel" class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Suma Compras</p>
                <p id="kpiPurchases" class="text-base font-bold text-white">Bs 0.00 M</p>
            </div>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                <p id="kpiInventoryLabel" class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Inventario Promed.</p>
                <p id="kpiInventory" class="text-base font-bold text-teal-400">Bs 0.00 M</p>
            </div>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                <p id="kpiRotationLabel" class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Rotación</p>
                <p id="kpiRotation" class="text-base font-bold text-amber-400">0.00x</p>
            </div>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700">
                <p id="kpiDaysLabel" class="text-[10px] font-semibold uppercase tracking-wider text-slate-400">Días Cobertura</p>
                <p id="kpiDays" class="text-base font-bold text-rose-400">0.00 días</p>
            </div>
        </section>

        <!-- Gráficos Principales -->
        <section class="grid grid-cols-3 gap-3 flex-1 min-h-0">
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex flex-col justify-between">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Compras vs Inventario (Millones Bs)</h3>
                <div class="relative flex-1 w-full"><canvas id="financialChart"></canvas></div>
            </div>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex flex-col justify-between">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Rotación (Veces)</h3>
                <div class="relative flex-1 w-full"><canvas id="rotationChart"></canvas></div>
            </div>
            <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex flex-col justify-between">
                <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Días de Stock</h3>
                <div class="relative flex-1 w-full"><canvas id="daysChart"></canvas></div>
            </div>
        </section>

        <!-- Capacidad Física (Racks & Estantes) -->
        <section class="grid grid-cols-2 gap-3">
            <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 flex items-center gap-3">
                <div class="w-10 h-10 flex-shrink-0"><canvas id="racksPieChart"></canvas></div>
                <div class="flex-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-300 uppercase">Racks</span>
                        <span id="racksUsedText" class="font-semibold text-teal-400 text-[11px]">-</span>
                    </div>
                    <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden mt-1">
                        <div id="racksProgressBar" class="bg-teal-500 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 flex items-center gap-3">
                <div class="w-10 h-10 flex-shrink-0"><canvas id="shelvesPieChart"></canvas></div>
                <div class="flex-1">
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-bold text-slate-300 uppercase">Estantes</span>
                        <span id="shelvesUsedText" class="font-semibold text-indigo-400 text-[11px]">-</span>
                    </div>
                    <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden mt-1">
                        <div id="shelvesProgressBar" class="bg-indigo-500 h-full w-0 transition-all duration-500"></div>
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        const DRIVE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSBNHSKcKRrfBmC9FxhGrMWbjjHf4JNV7_fVW8H-pdjcCh4rXvWpPaHUhGoUG1LpA/pub?output=csv";

        let rawData = [];
        let financialChartInstance = null;
        let rotationChartInstance = null;
        let daysChartInstance = null;
        let racksPieInstance = null;
        let shelvesPieInstance = null;

        const formatBsM = (val) => {
            const mill = val / 1000000;
            return 'Bs ' + mill.toLocaleString('es-BO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' M';
        };

        window.onload = function () {
            fetchDataDrive();
        };

        function setBadge(text, colorClass) {
            const badge = document.getElementById('liveBadge');
            badge.innerText = text;
            badge.className = "text-[10px] font-semibold px-2 py-0.5 rounded-full border " + colorClass;
        }

        function showStatus(msg, type) {
            const alert = document.getElementById('statusAlert');
            alert.className = "px-3 py-1 rounded-lg text-xs font-medium border " + (type === 'success' ? "bg-emerald-500/10 text-emerald-400 border-emerald-500/20" : type === 'error' ? "bg-rose-500/10 text-rose-400 border-rose-500/20" : "bg-blue-500/10 text-blue-400 border-blue-500/20");
            alert.innerText = msg;
            alert.classList.remove('hidden');
        }

        function fetchDataDrive() {
            setBadge("Conectando con Google Drive...", "bg-amber-500/20 text-amber-400 border-amber-500/30");

            fetch(DRIVE_CSV_URL)
                .then(response => {
                    if (!response.ok) throw new Error('No se pudo conectar con el enlace publicado de Google Drive.');
                    return response.text();
                })
                .then(csvText => {
                    parseCsvData(csvText);
                    if (rawData.length > 0) {
                        setBadge("Google Drive Conectado", "bg-emerald-500/20 text-emerald-400 border-emerald-500/30");
                        showStatus('¡Datos cargados directamente desde Google Drive con éxito!', 'success');
                    } else {
                        setBadge("Sin Registros", "bg-rose-500/20 text-rose-400 border-rose-500/30");
                        showStatus('No se encontraron registros válidos en la hoja de Google Drive.', 'error');
                    }
                })
                .catch(err => {
                    setBadge("Error de Conexión", "bg-rose-500/20 text-rose-400 border-rose-500/30");
                    showStatus('Error: ' + err.message, 'error');
                });
        }

        function splitCsvLine(line, separator) {
            let fields = [];
            let currentField = '';
            let insideQuotes = false;
            for (let i = 0; i < line.length; i++) {
                let char = line[i];
                if (char === '"') {
                    insideQuotes = !insideQuotes;
                } else if (char === separator && !insideQuotes) {
                    fields.push(currentField);
                    currentField = '';
                } else {
                    currentField += char;
                }
            }
            fields.push(currentField);
            return fields;
        }

        function parseCsvData(text) {
            const lines = text.split(/\r?\n/);
            if (lines.length < 2) { rawData = []; return; }

            const separator = lines[0].includes(";") ? ";" : ",";
            const cleanString = (str) => str.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/"/g, '').replace(/_/g, '').replace(/\s+/g, '');
            const headers = splitCsvLine(lines[0], separator).map(cleanString);

            const dataRows = [];
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                const columns = splitCsvLine(lines[i], separator);
                let rowObj = {};
                headers.forEach((header, index) => {
                    rowObj[header] = columns[index] ? columns[index].trim().replace(/"/g, '') : "";
                });
                dataRows.push(rowObj);
            }

            const cleanNumber = (val) => {
                if (!val) return 0;
                let s = String(val).replace(/[^0-9.,-]/g, '').trim();
                if (!s) return 0;

                if (s.includes('.') && s.includes(',')) {
                    s = s.replace(/\./g, '').replace(',', '.');
                } else if (s.includes('.')) {
                    let parts = s.split('.');
                    if (parts.length > 2 || (parts.length === 2 && parts[1].length === 3)) {
                        s = s.replace(/\./g, '');
                    }
                } else if (s.includes(',')) {
                    s = s.replace(',', '.');
                }
                return parseFloat(s) || 0;
            };

            rawData = dataRows.map(row => {
                const rowKeys = Object.keys(row);
                const yearKey = rowKeys.find(k => k.includes("ano") || k.includes("año"));
                const monthKey = rowKeys.find(k => k.includes("mes"));
                const invKey = rowKeys.find(k => k.includes("inventario"));
                const purKey = rowKeys.find(k => k.includes("compra"));
                const racksUsedKey = rowKeys.find(k => k.includes("racksocupados"));
                const racksTotalKey = rowKeys.find(k => k.includes("rackstotales"));
                const shelvesUsedKey = rowKeys.find(k => k.includes("estantesocupados"));
                const shelvesTotalKey = rowKeys.find(k => k.includes("estantestotales"));

                return {
                    year: yearKey ? parseInt(row[yearKey]) || 2026 : 2026,
                    month: monthKey ? String(row[monthKey]).toUpperCase().trim() : 'DESCONOCIDO',
                    avgInventory: invKey ? cleanNumber(row[invKey]) : 0,
                    purchases: purKey ? cleanNumber(row[purKey]) : 0,
                    racksUsed: racksUsedKey ? parseInt(cleanNumber(row[racksUsedKey])) : 0,
                    racksTotal: racksTotalKey ? parseInt(cleanNumber(row[racksTotalKey])) : 0,
                    shelvesUsed: shelvesUsedKey ? parseInt(cleanNumber(row[shelvesUsedKey])) : 0,
                    shelvesTotal: shelvesTotalKey ? parseInt(cleanNumber(row[shelvesTotalKey])) : 0
                };
            }).filter(r => r.month !== 'DESCONOCIDO' && r.month !== '');

            buildSelectors();
            updateDashboard();
        }

        function buildSelectors() {
            const yearSel = document.getElementById('yearSelector');
            const years = [...new Set(rawData.map(r => r.year))];
            yearSel.innerHTML = '<option value="Todos">Todos</option>';
            years.forEach(y => yearSel.innerHTML += `<option value="${y}">${y}</option>`);

            yearSel.value = years[years.length - 1] || "Todos";
            yearSel.onchange = () => {
                buildMonthOptions();
                updateDashboard();
            };

            document.getElementById('monthSelector').onchange = () => updateDashboard();
            buildMonthOptions();
        }

        function buildMonthOptions() {
            const selectedYear = document.getElementById('yearSelector').value;
            const filteredData = selectedYear !== 'Todos' ? rawData.filter(r => r.year == selectedYear) : rawData;
            const monthSel = document.getElementById('monthSelector');

            monthSel.innerHTML = '<option value="Todos">Todos</option>';
            filteredData.forEach(r => {
                monthSel.innerHTML += `<option value="${r.month}">${r.month}</option>`;
            });
            monthSel.value = "Todos";
        }

        function updateDashboard() {
            const selectedYear = document.getElementById('yearSelector').value;
            const selectedMonth = document.getElementById('monthSelector').value;

            let yearFilteredData = selectedYear !== 'Todos' ? rawData.filter(r => r.year == selectedYear) : rawData;
            if (yearFilteredData.length === 0) return;

            if (selectedMonth === "Todos") {
                const totalPurchases = yearFilteredData.reduce((sum, r) => sum + r.purchases, 0);
                const avgInventory = yearFilteredData.reduce((sum, r) => sum + r.avgInventory, 0) / yearFilteredData.length;
                const periodRotation = avgInventory > 0 ? totalPurchases / avgInventory : 0;
                const totalPeriodDays = periodRotation > 0 ? (yearFilteredData.length * 30) / periodRotation : 0;

                document.getElementById('kpiPurchasesLabel').innerText = "Suma Compras (Total)";
                document.getElementById('kpiPurchases').innerText = formatBsM(totalPurchases);
                document.getElementById('kpiInventoryLabel').innerText = "Inventario Promed. (Año)";
                document.getElementById('kpiInventory').innerText = formatBsM(avgInventory);
                document.getElementById('kpiRotationLabel').innerText = "Rotación (Período)";
                document.getElementById('kpiRotation').innerText = periodRotation.toFixed(2) + 'x';
                document.getElementById('kpiDaysLabel').innerText = "Días Cobertura (Prom.)";
                document.getElementById('kpiDays').innerText = totalPeriodDays.toFixed(2) + ' días';

                const latestMonthData = yearFilteredData[yearFilteredData.length - 1];
                updatePhysicalMetrics(latestMonthData);
            } else {
                const monthData = yearFilteredData.find(r => r.month === selectedMonth) || yearFilteredData[0];
                const mRotation = monthData.avgInventory > 0 ? monthData.purchases / monthData.avgInventory : 0;
                const mDays = mRotation > 0 ? 30 / mRotation : 0;

                document.getElementById('kpiPurchasesLabel').innerText = `Compras (${monthData.month})`;
                document.getElementById('kpiPurchases').innerText = formatBsM(monthData.purchases);
                document.getElementById('kpiInventoryLabel').innerText = `Inv. Promed. (${monthData.month})`;
                document.getElementById('kpiInventory').innerText = formatBsM(monthData.avgInventory);
                document.getElementById('kpiRotationLabel').innerText = `Rotación (${monthData.month})`;
                document.getElementById('kpiRotation').innerText = mRotation.toFixed(2) + 'x';
                document.getElementById('kpiDaysLabel').innerText = `Días Stock (${monthData.month})`;
                document.getElementById('kpiDays').innerText = mDays.toFixed(2) + ' días';

                updatePhysicalMetrics(monthData);
            }

            renderTrends(yearFilteredData);
        }

        function renderTrends(data) {
            const labels = data.map(r => r.month);
            const barColors = ['#38bdf8', '#818cf8', '#c084fc', '#f472b6', '#fb7185', '#34d399', '#fbbf24'];

            if (financialChartInstance) financialChartInstance.destroy();
            financialChartInstance = new Chart(document.getElementById('financialChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Suma Compras (M)', data: data.map(r => (r.purchases / 1000000).toFixed(2)), backgroundColor: barColors.slice(0, data.length), borderRadius: 4 },
                        { label: 'Inv. Promedio (M)', data: data.map(r => (r.avgInventory / 1000000).toFixed(2)), borderColor: '#2dd4bf', type: 'line', borderWidth: 2, pointRadius: 3 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#94a3b8', boxWidth: 10 } },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: Bs ${ctx.raw} M` } }
                    },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 9 } } },
                        y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 8 }, callback: (val) => val + ' M' } }
                    }
                }
            });

            const rotationData = data.map(r => r.avgInventory > 0 ? r.purchases / r.avgInventory : 0);
            if (rotationChartInstance) rotationChartInstance.destroy();
            rotationChartInstance = new Chart(document.getElementById('rotationChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Rotación (Veces)', data: rotationData, borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, borderWidth: 2, pointRadius: 3 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 10 } } }, scales: { x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 9 } } }, y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 8 } } } } }
            });

            const daysData = rotationData.map(rot => rot > 0 ? 30 / rot : 0);
            if (daysChartInstance) daysChartInstance.destroy();
            daysChartInstance = new Chart(document.getElementById('daysChart').getContext('2d'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{ label: 'Días de Stock', data: daysData, borderColor: '#f43f5e', backgroundColor: 'rgba(244, 63, 94, 0.1)', fill: true, borderWidth: 2, pointRadius: 3 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 10 } } }, scales: { x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 9 } } }, y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8', font: { size: 8 } } } } }
            });
        }

        function updatePhysicalMetrics(mData) {
            if (!mData) return;
            const hasRacks = mData.racksTotal > 0;
            const hasShelves = mData.shelvesTotal > 0;

            const rPct = hasRacks ? (mData.racksUsed / mData.racksTotal) * 100 : 0;
            document.getElementById('racksUsedText').innerText = hasRacks ? `${mData.racksUsed} / ${mData.racksTotal} (${rPct.toFixed(0)}%)` : '-';
            document.getElementById('racksProgressBar').style.width = `${rPct}%`;

            const sPct = hasShelves ? (mData.shelvesUsed / mData.shelvesTotal) * 100 : 0;
            document.getElementById('shelvesUsedText').innerText = hasShelves ? `${mData.shelvesUsed} / ${mData.shelvesTotal} (${sPct.toFixed(0)}%)` : '-';
            document.getElementById('shelvesProgressBar').style.width = `${sPct}%`;

            if (racksPieInstance) racksPieInstance.destroy();
            racksPieInstance = new Chart(document.getElementById('racksPieChart'), { type: 'doughnut', data: { datasets: [{ data: hasRacks ? [mData.racksUsed, mData.racksTotal - mData.racksUsed] : [0, 1], backgroundColor: [rPct >= 85 ? '#f43f5e' : '#2dd4bf', '#334155'], borderWidth: 0 }] }, options: { responsive: true, cutout: '75%', plugins: { tooltip: { enabled: false } } } });

            if (shelvesPieInstance) shelvesPieInstance.destroy();
            shelvesPieInstance = new Chart(document.getElementById('shelvesPieChart'), { type: 'doughnut', data: { datasets: [{ data: hasShelves ? [mData.shelvesUsed, mData.shelvesTotal - mData.shelvesUsed] : [0, 1], backgroundColor: [sPct >= 85 ? '#f43f5e' : '#6366f1', '#334155'], borderWidth: 0 }] }, options: { responsive: true, cutout: '75%', plugins: { tooltip: { enabled: false } } } });
        }
    </script>
</body>
</html>
